<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Reyes</title>
<script>try{if(localStorage.getItem("lista-reyes-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<meta name="theme-color" content="#5b5bd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reyes">
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>
<header class="top">
  <div>
    <h1>👑 Lista de Reyes</h1>
    <div id="sync-status" class="sync"></div>
  </div>
  <div class="top-actions">
    <button id="btn-filter" class="pillbtn" aria-expanded="false" title="Filtrar regalos">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
      <span class="lbl">Filtrar</span><span id="filter-count" class="cnt"></span>
    </button>
    <div class="menu">
      <button id="btn-menu" class="pillbtn" aria-haspopup="true" aria-expanded="false">☰ Menú</button>
      <div id="menu-panel" class="menu-panel" hidden>
        <button id="btn-share">🔗 Compartir</button>
        <hr>
        <button id="btn-cats">🏷️ Categorías</button>
        <button id="btn-buyers">👥 Quién compra</button>
        <button id="btn-fams">👪 Familias</button>
        <hr>
        <button id="btn-export">⬇️ Exportar copia</button>
        <label class="btn">⬆️ Importar copia<input id="file-import" type="file" accept="application/json" hidden></label>
        <hr>
        <button id="btn-dups">⚠️ Aviso de duplicados</button>
        <button id="btn-install" hidden>📲 Instalar como app</button>
        <button id="btn-theme">🌙 Tema oscuro</button>
      </div>
    </div>
  </div>
</header>

<div id="filters" class="filters" hidden>
  <select id="f-status" aria-label="Estado">
    <option value="">Todos los estados</option>
    <option value="none">Sin estado</option>
    <option value="idea">💡 Idea</option>
    <option value="store">🏬 Comprado en tienda</option>
    <option value="online">🌐 Comprado online</option>
    <option value="received">📦 Recibido</option>
  </select>
  <select id="f-cat" aria-label="Categoría"></select>
</div>

<main id="board" class="board"></main>

<dialog id="dlg-gift">
  <form method="dialog" id="form-gift">
    <h2 id="gift-title">Nuevo regalo</h2>
    <label>Regalo <input name="name" required maxlength="120"></label>
    <div id="dup-warn" class="warn" hidden><span id="dup-txt"></span><button type="button" id="dup-ignore" class="linkbtn">Quitar aviso</button></div>
    <div class="lbl">Estado</div>
    <div id="gift-status" class="seg">
      <button type="button" data-s="idea"><b>💡</b>Idea</button>
      <button type="button" data-s="store"><b>🏬</b>Tienda</button>
      <button type="button" data-s="online"><b>🌐</b>Online</button>
      <button type="button" data-s="received"><b>📦</b>Recibido</button>
    </div>
    <input type="hidden" name="status" value="idea">
    <fieldset><legend>Categorías</legend><div id="gift-cats" class="chips"></div></fieldset>
    <label>Lo compra <select name="buyer" class="sel"></select></label>
    <button type="button" id="buyer-names" class="linkbtn" hidden>¿Cómo os llamáis? Poner nombres</button>
    <details id="more" class="more">
      <summary>Más detalles (tienda, enlace, notas)</summary>
      <label>Tienda <input name="store" maxlength="80" placeholder="Amazon, El Corte Inglés…"></label>
      <label>Enlace <input name="link" type="url" placeholder="https://…"></label>
      <label>Notas <input name="notes" maxlength="200"></label>
    </details>
    <div class="row">
      <button type="button" id="gift-delete" class="danger" hidden>🗑️ Eliminar</button>
      <button type="button" id="gift-cancel" class="ghost">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-child">
  <form id="form-child" method="dialog">
    <h2 id="owner-title">Editar ficha</h2>
    <label>Nombre <input name="name" required maxlength="30"></label>
    <div id="owner-prof">
      <div class="two"><label>Edad <input name="age" maxlength="12" placeholder="7"></label><label>Calzado <input name="shoe" maxlength="12" placeholder="32"></label></div>
      <label>Talla de ropa <input name="size" maxlength="20" placeholder="8 años"></label>
      <label>Le gusta <input name="likes" maxlength="120" placeholder="Dinosaurios, Lego…"></label>
      <label>Evitar / ya tiene <input name="avoid" maxlength="120" placeholder="Peluches…"></label>
    </div>
    <label id="owner-color">Color <input name="color" type="color" value="#9ccaf5"></label>
    <div class="row">
      <button type="button" id="child-delete" class="danger">🗑️ Eliminar</button>
      <button type="button" id="child-cancel" class="ghost">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-buyers">
  <h2>Quién compra</h2>
  <p class="hint">Los dos nombres que aparecen en «Lo compra» al editar un regalo.</p>
  <div id="buyer-list"></div>
  <div class="row"><button id="buyers-close" class="ghost">Cerrar</button></div>
</dialog>

<dialog id="dlg-cats">
  <h2>Categorías</h2>
  <div id="cat-list"></div>
  <form id="form-cat" class="catform">
    <input name="name" placeholder="Nueva categoría" required maxlength="30">
    <input name="color" type="color" value="#7c5cff" aria-label="Color">
    <input name="icon" class="emo" maxlength="4" placeholder="🎁" aria-label="Icono">
    <button class="primary">Añadir</button>
  </form>
  <div class="row"><button id="cats-close" class="ghost">Cerrar</button></div>
</dialog>

<dialog id="dlg-add">
  <form id="form-add" method="dialog">
    <h2>Añadir persona</h2>
    <label>Nombre <input name="name" required maxlength="30"></label>
    <label>Grupo <select name="group" class="sel"></select></label>
    <label id="newfam" hidden>Nombre de la familia <input name="fam" maxlength="30"></label>
    <div class="row">
      <button type="button" id="add-cancel" class="ghost">Cancelar</button>
      <button type="submit" class="primary">Añadir</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-fams">
  <h2>Familias</h2>
  <div id="fam-list"></div>
  <div class="row"><button id="fam-add" class="ghost">＋ Familia</button><button id="fams-close" class="primary">Cerrar</button></div>
</dialog>

<form id="quick" class="quick" hidden>
  <input id="quick-name" maxlength="120" placeholder="Añadir regalo…" autocomplete="off" enterkeyhint="done" aria-label="Nombre del regalo">
  <button class="plus" aria-label="Añadir regalo">＋</button>
</form>
<nav id="nav" class="nav" aria-label="Secciones">
  <button data-view="home"><b>🏠</b>Resumen</button>
  <button data-view="gifts"><b>🎁</b>Regalos</button>
  <button data-view="shop"><b>🛒</b>Compras<i id="nav-badge" hidden></i></button>
</nav>

<div id="version" class="version" aria-hidden="true"></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=30"></script>
</body>
</html>
